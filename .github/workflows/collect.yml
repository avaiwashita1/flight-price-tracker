name: Collect flight prices

on:
  # Started every 3 hours by an external scheduler (cron-job.org) calling the
  # workflow_dispatch API, because GitHub's own schedule skipped most runs.
  # You can also start a run by hand from the Actions tab.
  workflow_dispatch: {}

permissions:
  contents: write  # to commit the CSV backup

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python run.py
      - name: Upload Excel file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight_prices
          path: output/flight_prices.xlsx
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit CSV data
        if: always()
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "flight-tracker-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Add observations $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
